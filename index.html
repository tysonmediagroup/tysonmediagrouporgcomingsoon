<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TYSON Media Group — 12/19/26</title>
  <link rel="icon" type="image/png" href="/assets/tysonmediagroup-icon.png">
  <link rel="apple-touch-icon" href="/assets/tysonmediagroup-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fullscreen Cinematic Canvas */
    canvas#stage {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 1;
    }

    /* Initial "Click Anywhere" Gate */
    .enter-gate {
      position: absolute;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    .enter-gate.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .enter-prompt {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #666666;
      transition: color 0.3s ease;
      animation: pulsePrompt 2.6s ease-in-out infinite;
    }

    .enter-gate:hover .enter-prompt {
      color: #ffffff;
    }

    @keyframes pulsePrompt {
      0%, 100% { opacity: 0.35; transform: scale(0.99); }
      50% { opacity: 0.9; transform: scale(1.0); }
    }

    /* Minimal Discrete Audio Indicator (Bottom Corner) */
    .audio-indicator {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 1s ease;
      cursor: pointer;
    }

    .audio-indicator.visible {
      opacity: 0.35;
    }

    .audio-indicator:hover {
      opacity: 0.9;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .eq-bar {
      width: 2px;
      background: #ffffff;
      height: 4px;
      border-radius: 1px;
    }

    .audio-indicator.playing .eq-bar:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
    .audio-indicator.playing .eq-bar:nth-child(2) { animation: eq 1.1s ease-in-out 0.2s infinite alternate; }
    .audio-indicator.playing .eq-bar:nth-child(3) { animation: eq 0.9s ease-in-out 0.4s infinite alternate; }
    .audio-indicator.playing .eq-bar:nth-child(4) { animation: eq 1.3s ease-in-out 0.1s infinite alternate; }

    @keyframes eq {
      0% { height: 2px; }
      100% { height: 12px; }
    }

    .audio-track-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Rendering Canvas -->
  <canvas id="stage"></canvas>

  <!-- Click Anywhere Gate to Allow Browser Autoplay -->
  <div class="enter-gate" id="enterGate" onclick="startExperience()">
    <div class="enter-prompt">[ Click Anywhere to Enter ]</div>
  </div>

  <!-- Ambient Audio Indicator in Corner -->
  <div class="audio-indicator" id="audioIndicator" onclick="toggleAudio()">
    <div class="eq-bars">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
    <div class="audio-track-label" id="audioLabel">Whitesnake</div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const enterGate = document.getElementById('enterGate');
    const audioIndicator = document.getElementById('audioIndicator');
    const audioLabel = document.getElementById('audioLabel');

    // Dedicated offscreen canvas for strictly clipped specular glint
    const textCanvas = document.createElement('canvas');
    const textCtx = textCanvas.getContext('2d');

    // Audio Engine
    let audioCtx = null;
    let audioElement = new Audio('audio.mp3');
    audioElement.preload = 'auto';
    audioElement.loop = true;

    let isStarted = false;
    let isPlaying = false;
    let currentTime = 0;
    let lastAudioTime = 0;
    let lastAudioTick = performance.now();
    let animFrameId = null;

    // Responsive Canvas Resize
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      renderFrame(currentTime);
    }
    window.addEventListener('resize', resizeCanvas);
    document.fonts.ready.then(resizeCanvas);

    // Easing curves
    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }
    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function easeInOutSine(x) {
      return -(Math.cos(Math.PI * x) - 1) / 2;
    }

    // Start Experience on First Click
    function startExperience() {
      if (isStarted) return;
      isStarted = true;

      enterGate.classList.add('dismissed');
      audioIndicator.classList.add('visible', 'playing');

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audioElement.currentTime = 0;
      audioElement.play().catch(e => console.log('Audio autoplay policy fallback', e));

      isPlaying = true;
      lastAudioTime = 0;
      lastAudioTick = performance.now();
      animFrameId = requestAnimationFrame(loop);
    }

    // Toggle Audio Pause/Play
    function toggleAudio() {
      if (!isStarted) return;
      if (audioElement.paused) {
        audioElement.play();
        isPlaying = true;
        audioIndicator.classList.add('playing');
        audioLabel.textContent = 'Whitesnake';
      } else {
        audioElement.pause();
        audioIndicator.classList.remove('playing');
        audioLabel.textContent = 'Paused';
      }
    }

    // Phase-Locked Render Loop
    function loop() {
      const now = performance.now();

      if (audioElement && !audioElement.paused) {
        const aTime = audioElement.currentTime;
        if (aTime !== lastAudioTime) {
          lastAudioTime = aTime;
          lastAudioTick = now;
          currentTime = aTime;
        } else {
          currentTime = lastAudioTime + (now - lastAudioTick) / 1000;
        }
      } else if (isPlaying) {
        currentTime += 0.016;
      }

      renderFrame(currentTime);
      animFrameId = requestAnimationFrame(loop);
    }

    // ==========================================
    // IMMERSIVE WEB LANDING ENGINE
    // 0.0s - 1.0s: Song's initial ambient silence (pure black)
    // 1.0s - 3.7s: tysonmediagroup.org writes on left-to-right
    // 3.7s: First chord shine sweeps through logo
    // 7.0s: 12/19/26 reveals at bottom and stays anchored
    // >7.0s: Logo stays in center, 12/19 on bottom, periodic specular shines
    // ==========================================
    function renderFrame(t) {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // 100% Pitch Black Void
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      if (t < 1.0) {
        return; // Blank before first note
      }

      // ----------------------------------------------------
      // 1. CENTER LOGO: tysonmediagroup.org
      // FONT: Cormorant Garamond, Italic, Thin (Weight 300)
      // ----------------------------------------------------
      if (textCanvas.width !== w || textCanvas.height !== h) {
        textCanvas.width = w;
        textCanvas.height = h;
      }
      textCtx.clearRect(0, 0, w, h);

      // Responsive font sizing: adaptive to mobile & widescreen
      const isMobile = w < h;
      const baseRatio = isMobile ? 0.088 : 0.068;
      const fontSize = Math.max(28, Math.min(150, Math.round(w * baseRatio)));

      textCtx.font = `italic 300 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'middle';

      const logoText = "tysonmediagroup.org";
      const metrics = textCtx.measureText(logoText);
      const textWidth = metrics.width;

      const textStartX = cx - textWidth / 2;
      const textEndX = cx + textWidth / 2;

      // Visual vertical center (slightly elevated to balance with bottom date)
      const logoY = cy - (h * 0.035);

      // --------------------------------------------------
      // WRITE-ON PHASE: 1.0s to 3.7s (Initial Opening)
      // --------------------------------------------------
      const traceStart = 1.0;
      const traceEnd = 3.7;

      if (t < traceEnd) {
        const rawTrace = Math.min(1.0, Math.max(0, (t - traceStart) / (traceEnd - traceStart)));
        const easedTrace = easeOutCubic(rawTrace);

        // Immediate strike at 1.000s
        const feather = 24;
        const currentHeadX = textStartX + (textEndX - textStartX + 20) * easedTrace;

        // Draw solid text
        textCtx.save();
        textCtx.fillStyle = '#ffffff';
        textCtx.fillText(logoText, cx, logoY);

        // Progressive wipe mask
        textCtx.globalCompositeOperation = 'destination-in';
        const maskGrad = textCtx.createLinearGradient(0, logoY, w, logoY);
        const pStart = Math.max(0, Math.min(1, (currentHeadX - feather) / w));
        const pEnd = Math.max(0, Math.min(1, currentHeadX / w));

        maskGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
        maskGrad.addColorStop(pStart, 'rgba(0, 0, 0, 1)');
        maskGrad.addColorStop(pEnd, 'rgba(0, 0, 0, 0)');
        maskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        textCtx.fillStyle = maskGrad;
        textCtx.fillRect(0, 0, w, h);
        textCtx.restore();

        // Baseline Spark during initial write-on
        if (currentHeadX >= textStartX && currentHeadX <= textEndX + 20) {
          const baselineY = logoY + fontSize * 0.28;
          const sparkX = Math.min(textEndX, currentHeadX);

          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          const sparkAlpha = Math.sin(rawTrace * Math.PI) * 0.85;

          const raySpan = fontSize * 1.4;
          const rayGrad = ctx.createLinearGradient(sparkX - raySpan, baselineY, sparkX + raySpan, baselineY);
          rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          rayGrad.addColorStop(0.5, `rgba(255, 255, 255, ${sparkAlpha})`);
          rayGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.fillStyle = rayGrad;
          ctx.fillRect(sparkX - raySpan, baselineY - 1, raySpan * 2, 2);

          const orb = ctx.createRadialGradient(sparkX, baselineY, 0, sparkX, baselineY, 12);
          orb.addColorStop(0, `rgba(255, 255, 255, ${sparkAlpha})`);
          orb.addColorStop(0.5, `rgba(255, 255, 255, ${sparkAlpha * 0.3})`);
          orb.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = orb;
          ctx.beginPath();
          ctx.arc(sparkX, baselineY, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

      } else {
        // Logo is fully revealed and stays permanently on screen
        textCtx.fillStyle = '#ffffff';
        textCtx.fillText(logoText, cx, logoY);

        // --------------------------------------------------
        // SPECULAR SHINE ENGINE (LOOPING)
        // 1st shine: 3.7s - 6.6s (Chord 2)
        // Subsequent shines: Every ~9.5s across the whole song!
        // --------------------------------------------------
        let isShining = false;
        let shineProgress = 0;

        if (t >= 3.7 && t <= 6.6) {
          isShining = true;
          shineProgress = easeInOutCubic((t - 3.7) / (6.6 - 3.7));
        } else if (t > 7.5) {
          const loopPeriod = 9.5;
          const cycleTime = (t - 7.5) % loopPeriod;
          const shineDuration = 3.0;

          if (cycleTime < shineDuration) {
            isShining = true;
            shineProgress = easeInOutCubic(cycleTime / shineDuration);
          }
        }

        if (isShining) {
          const startX = cx - textWidth * 0.65;
          const endX = cx + textWidth * 0.65;
          const sweepX = startX + (endX - startX) * shineProgress;

          // 1. Internal Chrome Slant Gleam (100% strictly inside letters)
          textCtx.save();
          textCtx.globalCompositeOperation = 'source-atop';

          const slantOffset = fontSize * 0.42;
          const beamWidth = fontSize * 1.1;

          const shineGrad = textCtx.createLinearGradient(
            sweepX - beamWidth - slantOffset, logoY + fontSize * 0.6,
            sweepX + beamWidth + slantOffset, logoY - fontSize * 0.6
          );

          shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          shineGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.08)');
          shineGrad.addColorStop(0.48, 'rgba(255, 255, 255, 0.85)');
          shineGrad.addColorStop(0.50, 'rgba(255, 255, 255, 1.0)');
          shineGrad.addColorStop(0.52, 'rgba(255, 255, 255, 0.85)');
          shineGrad.addColorStop(0.65, 'rgba(255, 255, 255, 0.08)');
          shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          textCtx.fillStyle = shineGrad;
          textCtx.fillRect(0, 0, w, h);
          textCtx.restore();

          // 2. Parallel Baseline Specular Glow Streak
          const glintAlpha = Math.sin(shineProgress * Math.PI) * 0.95;
          if (glintAlpha > 0.02) {
            const baselineY = logoY + fontSize * 0.28;
            const streakSpan = fontSize * 2.8;

            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const parallelGleam = ctx.createLinearGradient(
              sweepX - streakSpan, baselineY,
              sweepX + streakSpan, baselineY
            );
            parallelGleam.addColorStop(0, 'rgba(255, 255, 255, 0)');
            parallelGleam.addColorStop(0.4, `rgba(255, 255, 255, ${glintAlpha * 0.3})`);
            parallelGleam.addColorStop(0.5, `rgba(255, 255, 255, ${glintAlpha * 0.95})`);
            parallelGleam.addColorStop(0.6, `rgba(255, 255, 255, ${glintAlpha * 0.3})`);
            parallelGleam.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = parallelGleam;
            ctx.fillRect(sweepX - streakSpan, baselineY - 1, streakSpan * 2, 2);

            const orb = ctx.createRadialGradient(sweepX, baselineY, 0, sweepX, baselineY, 18);
            orb.addColorStop(0, `rgba(255, 255, 255, ${glintAlpha})`);
            orb.addColorStop(0.4, `rgba(255, 255, 255, ${glintAlpha * 0.3})`);
            orb.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = orb;
            ctx.beginPath();
            ctx.arc(sweepX, baselineY, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }
      }

      // Paint text buffer onto main stage
      ctx.drawImage(textCanvas, 0, 0);

      // ----------------------------------------------------
      // 2. BOTTOM DATE: 12/19/26
      // Fades in at 7.0s (timed to chord/bass swell)
      // Stays permanently anchored on the bottom of the viewport
      // ----------------------------------------------------
      if (t >= 6.8) {
        const dateAlpha = Math.min(1.0, (t - 6.8) / 1.0);

        ctx.save();
        const dateBottomY = h - Math.max(40, h * 0.12);

        // Thin elegant hairline divider above the bottom date
        const lineWidth = Math.min(160, w * 0.15);
        ctx.strokeStyle = `rgba(255, 255, 255, ${dateAlpha * 0.25})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - lineWidth / 2, dateBottomY - 26);
        ctx.lineTo(cx + lineWidth / 2, dateBottomY - 26);
        ctx.stroke();

        // Upright, non-italic Cormorant Garamond 12/19/26
        const dateFontSize = Math.max(16, Math.min(42, Math.round(fontSize * 0.38)));
        ctx.font = `normal 400 ${dateFontSize}px "Cormorant Garamond", Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = `rgba(255, 255, 255, ${dateAlpha * 0.95})`;
        ctx.fillText("12/19/26", cx, dateBottomY);

        ctx.restore();
      }
    }

    // Dismiss gate on keyboard Space / Enter as well
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        if (!isStarted) {
          startExperience();
        } else {
          toggleAudio();
        }
      }
    });
  </script>
</body>
</html>
